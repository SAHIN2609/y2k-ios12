name: build-deb

# Builds the iOS 12 y2k clone on a LINUX runner and uploads the .deb.
#
# Two stages:
#   1. a real compile check of every Swift file against the iOS SDK with
#      swiftc -target arm64-apple-ios12.0 (a typecheck, no link)
#   2. the Theos package step that produces the .deb
#
# Run from the Actions tab: Actions ▸ build-deb ▸ Run workflow.
# Artifacts: y2k-ios12-deb (the package), build-log (compiler output).

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'

env:
  # Pin one toolchain so the SDK/compiler pair stays consistent.
  SWIFT_VERSION: "6.0.3"
  SDK_VERSION: "iPhoneOS12.4.sdk"

jobs:
  build:
    name: Compile + package (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain (swift, ldid, dpkg, make)
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates unzip xz-utils libcurl4 libxml2 \
            libncurses6 libpython3-dev libsqlite3-0 libedit2 \
            zlib1g-dev libz3-dev pkg-config tzdata \
            dpkg-dev build-essential git
          echo "--- swift ---"
          # The official Linux tarball; no macOS runner involved anywhere.
          curl -fsSL -o /tmp/swift.tar.gz \
            "https://download.swift.org/swift-${SWIFT_VERSION}-release/ubuntu2204/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE-ubuntu22.04.tar.gz"
          mkdir -p "$HOME/swift"
          tar xzf /tmp/swift.tar.gz -C "$HOME/swift" --strip-components=1
          echo "$HOME/swift/usr/bin" >> $GITHUB_PATH
          export PATH="$HOME/swift/usr/bin:$PATH"
          swift --version

      - name: Fetch the iOS SDK
        run: |
          set -eux
          # theos/sdks carries Apple's SDKs; sparse-checkout just the one we need.
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set "$SDK_VERSION"
          sudo mkdir -p /opt/ios-sdk
          sudo cp -R "/tmp/sdks/$SDK_VERSION" /opt/ios-sdk/
          ls /opt/ios-sdk/"$SDK_VERSION"
          echo "SDKROOT=/opt/ios-sdk/$SDK_VERSION" >> $GITHUB_ENV

      - name: Fetch ldid
        run: |
          set -eux
          # Procursus build of ldid, used to ad-hoc sign the Mach-O.
          curl -fsSL -o /tmp/ldid.deb \
            "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64.deb" \
            || curl -fsSL -o /tmp/ldid.deb \
            "https://apt.procurs.us/pool/main/iphoneos-arm64/1700/ldid/ldid_2.1.5-procursus7_iphoneos-arm64.deb"
          dpkg-deb -x /tmp/ldid.deb /tmp/ldid
          sudo cp /tmp/ldid/usr/bin/ldid /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid
          ldid -v || true

      - name: Typecheck every Swift file against the iOS SDK
        id: typecheck
        run: |
          set -o pipefail
          swiftc -typecheck \
            -target arm64-apple-ios12.0 \
            -sdk "$SDKROOT" \
            -swift-version 5 \
            -module-name y2k \
            $(find Y2K -name '*.swift') 2>&1 | tee typecheck.log
        continue-on-error: true

      - name: Report typecheck result
        run: |
          if grep -qE "error:" typecheck.log; then
            echo "::error::Swift typecheck found errors — see the build-log artifact"
            grep -E "error:" typecheck.log | head -40
            exit 1
          fi
          echo "Typecheck clean."

      - name: Link the executable
        run: |
          set -o pipefail
          mkdir -p build
          swiftc \
            -target arm64-apple-ios12.0 \
            -sdk "$SDKROOT" \
            -swift-version 5 \
            -module-name y2k \
            -emit-executable \
            -Xlinker -rpath -Xlinker /usr/lib/swift \
            -o build/y2k \
            $(find Y2K -name '*.swift') 2>&1 | tee link.log
          file build/y2k
          ls -la build/y2k

      - name: Assemble the .app bundle
        run: |
          set -eux
          APP=build/y2k.app
          mkdir -p "$APP"
          cp build/y2k "$APP/y2k"
          cp Y2K/Support/Info.plist "$APP/Info.plist"
          cp Resources/*.ttf Resources/*.otf "$APP/" 2>/dev/null || true
          cp -R Resources/LUTs Resources/Stickers Resources/AppIcon "$APP/"
          for d in Resources/*.lproj; do cp -R "$d" "$APP/"; done
          # ad-hoc sign with the project's entitlements
          ldid -SY2K/Support/y2k.entitlements "$APP/y2k" || ldid -S "$APP/y2k"
          ldid -e "$APP/y2k" | head -20 || true

      - name: Build the .deb
        run: |
          set -eux
          OUT=y2k_2.03_ios12_iphoneos-arm.deb
          ROOT=$(mktemp -d)
          mkdir -p "$ROOT/Applications" "$ROOT/DEBIAN"
          cp -R build/y2k.app "$ROOT/Applications/"
          cp control "$ROOT/DEBIAN/control"
          chmod 644 "$ROOT/DEBIAN/control"
          chmod 755 "$ROOT/Applications/y2k.app/y2k"
          # dpkg-deb writes the ar container correctly, no hand-rolled headers
          dpkg-deb --build --root-owner-group "$ROOT" "$OUT"
          dpkg-deb --info "$OUT"
          dpkg-deb --contents "$OUT" | head -20
          ls -la "$OUT"

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: y2k-ios12-deb
          path: y2k_2.03_ios12_iphoneos-arm.deb
          if-no-files-found: error

      - name: Upload compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            typecheck.log
            link.log
          if-no-files-found: ignore
