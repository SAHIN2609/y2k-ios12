name: build-deb

# Builds the y2k iOS 12 clone on a LINUX runner and uploads the .deb.
#
# This variant compiles the Swift sources against Apple's iOS 12.4 SDK using a
# Linux swiftc plus the arm64-apple-ios standard library modules that ship
# inside a macOS Swift toolchain (extracted here, no macOS runner needed).
#
# Actions ▸ build-deb ▸ Run workflow
# Artifacts: y2k-ios12-deb (the package), build-log (compiler output)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'

env:
  SWIFT_VERSION: "6.0.3"
  SDK_VERSION: "iPhoneOS12.4.sdk"

jobs:
  build:
    name: Compile + package (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host packages
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates unzip xz-utils p7zip-full \
            libcurl4 libxml2 libncurses6 libpython3-dev libsqlite3-0 \
            libedit2 zlib1g-dev libz3-dev pkg-config tzdata \
            dpkg-dev build-essential git
          echo "--- swift ---"
          curl -fsSL -o /tmp/swift.tar.gz \
            "https://download.swift.org/swift-${SWIFT_VERSION}-release/ubuntu2204/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE-ubuntu22.04.tar.gz"
          mkdir -p "$HOME/swift"
          tar xzf /tmp/swift.tar.gz -C "$HOME/swift" --strip-components=1
          echo "$HOME/swift/usr/bin" >> $GITHUB_PATH
          export PATH="$HOME/swift/usr/bin:$PATH"
          swift --version

      - name: Fetch the iOS 12.4 SDK
        run: |
          set -eux
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set "$SDK_VERSION"
          sudo mkdir -p /opt/ios-sdk
          sudo cp -R "$SDK_VERSION" /opt/ios-sdk/
          echo "SDKROOT=/opt/ios-sdk/$SDK_VERSION" >> $GITHUB_ENV
          ls /opt/ios-sdk/"$SDK_VERSION"

      - name: Extract arm64-apple-ios Swift stdlib modules
        run: |
          set -eux
          # A Linux swiftc ships no modules for Apple targets. Apple's macOS
          # toolchain does (arm64-apple-ios.swiftmodule in usr/lib/swift and
          # inside each framework). Pull the macOS toolchain tarball and keep
          # just those - no macOS runner is involved.
          #
          # swift.org moved macOS toolchains to the .xctoolchain.tar.gz form;
          # try each known layout until one downloads.
          mkdir -p /opt/apple-swift
          GOT=0
          for URL in \
            "https://download.swift.org/swift-${SWIFT_VERSION}-release/xcode/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE-osx.xctoolchain.tar.gz" \
            "https://download.swift.org/swift-${SWIFT_VERSION}-release/xcode/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE-osx.pkg" \
            "https://download.swift.org/swift-${SWIFT_VERSION}-release/xcode/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE-osx.tar.gz" ; do
            echo "trying $URL"
            if curl -fsSL --max-time 900 -o /tmp/macswift "$URL"; then
              echo "downloaded $URL"
              GOT=1
              break
            fi
          done
          [ "$GOT" = "1" ] || { echo "::error::could not download a macOS Swift toolchain"; exit 1; }
          # The .pkg is a flat xar archive whose Payload is a gzipped cpio of
          # the toolchain. xar isn't packaged on Ubuntu runners, so use the
          # pkgutil-compatible python unpacker.
          cd /opt/apple-swift
          python3 - <<'EOF'
          import struct, zlib, os, subprocess, tempfile
          data = open('/tmp/macswift','rb').read()
          assert data[:4] == b'xar!', data[:4]
          header_size, version, toc_len, toc_ck, alg = struct.unpack('>IHIQQ', data[:28])[:5]
          toc = zlib.decompress(data[header_size:header_size+toc_len])
          # crude but sufficient: pull every <offset>/<length> file entry
          import re
          heap = header_size + toc_len
          for m in re.finditer(rb'<file id="\d+">.*?</file>', toc, re.S):
              blk = m.group(0)
              off = re.search(rb'<offset>(\d+)</offset>', blk)
              ln = re.search(rb'<length>(\d+)</length>', blk)
              nm = re.search(rb'<name>([^<]+)</name>', blk)
              if not (off and ln and nm):
                  continue
              name = nm.group(1).decode()
              if name != 'Payload':
                  continue
              raw = data[heap+int(off.group(1)): heap+int(off.group(1))+int(ln.group(1))]
              open('/tmp/payload.cpio.gz','wb').write(raw)
              print('Payload', len(raw), 'bytes')
          EOF
          cd /opt/apple-swift
          gunzip -c /tmp/payload.cpio.gz | cpio -idmu --quiet 2>/dev/null || true
          # toolchain path inside the payload is usually Swift.xctoolchain/...
          if [ -d /opt/apple-swift/Swift.xctoolchain ]; then
            cp -R /opt/apple-swift/Swift.xctoolchain/. /opt/apple-swift/
          fi
          echo "--- iOS modules found ---"
          find /opt/apple-swift -type d -name "arm64-apple-ios*" 2>/dev/null | head -20 || true

      - name: Typecheck the Swift sources
        id: typecheck
        run: |
          set -o pipefail
          SWIFT_MODULE_FLAGS=""
          if [ -d /opt/apple-swift/usr/lib/swift ]; then
            SWIFT_MODULE_FLAGS="-I /opt/apple-swift/usr/lib/swift -L /opt/apple-swift/usr/lib/swift"
          fi
          swiftc -typecheck \
            -target arm64-apple-ios12.0 \
            -sdk "$SDKROOT" \
            -swift-version 5 \
            -module-name y2k \
            $SWIFT_MODULE_FLAGS \
            $(find Y2K -name '*.swift') 2>&1 | tee typecheck.log
        continue-on-error: true

      - name: Report typecheck result
        run: |
          if grep -qE "error:" typecheck.log; then
            echo "::error::Swift typecheck found errors — see the build-log artifact"
            grep -E "error:" typecheck.log | head -40
            exit 1
          fi
          echo "Typecheck clean."

      - name: Link the executable
        run: |
          set -o pipefail
          mkdir -p build
          swiftc \
            -target arm64-apple-ios12.0 \
            -sdk "$SDKROOT" \
            -swift-version 5 \
            -module-name y2k \
            -emit-executable \
            -Xlinker -rpath -Xlinker /usr/lib/swift \
            -o build/y2k \
            $(find Y2K -name '*.swift') 2>&1 | tee link.log
          file build/y2k
          ls -la build/y2k

      - name: Assemble the .app bundle
        run: |
          set -eux
          APP=build/y2k.app
          mkdir -p "$APP"
          cp build/y2k "$APP/y2k"
          cp Y2K/Support/Info.plist "$APP/Info.plist"
          cp Resources/*.ttf Resources/*.otf "$APP/" 2>/dev/null || true
          cp -R Resources/LUTs Resources/Stickers Resources/AppIcon "$APP/"
          for d in Resources/*.lproj; do cp -R "$d" "$APP/"; done

      - name: Build the .deb
        run: |
          set -eux
          OUT=y2k_2.03_ios12_iphoneos-arm.deb
          ROOT=$(mktemp -d)
          mkdir -p "$ROOT/Applications" "$ROOT/DEBIAN"
          cp -R build/y2k.app "$ROOT/Applications/"
          cp control "$ROOT/DEBIAN/control"
          chmod 644 "$ROOT/DEBIAN/control"
          chmod 755 "$ROOT/Applications/y2k.app/y2k"
          dpkg-deb --build --root-owner-group "$ROOT" "$OUT"
          dpkg-deb --info "$OUT"
          dpkg-deb --contents "$OUT" | head -20
          ls -la "$OUT"

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: y2k-ios12-deb
          path: y2k_2.03_ios12_iphoneos-arm.deb
          if-no-files-found: error

      - name: Upload compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            typecheck.log
            link.log
          if-no-files-found: ignore
