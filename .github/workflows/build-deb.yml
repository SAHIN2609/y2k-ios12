name: build-deb

# Builds the y2k iOS 12 clone on a real macOS runner (Xcode + Theos) and
# uploads the finished .deb as a downloadable artifact.
#
# Actions ▸ build-deb ▸ Run workflow
# Artifacts: y2k-ios12-deb (the package), build-log (compiler output)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'

jobs:
  build:
    name: Build y2k.app + .deb (iOS 12)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install Theos
        run: |
          set -eux
          export THEOS="$HOME/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Install ldid
        run: |
          set -eux
          brew install ldid || true
          command -v ldid && ldid -v || true

      - name: Fetch the iOS 12.4 SDK for Theos
        run: |
          set -eux
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set iPhoneOS12.4.sdk
          mkdir -p "$THEOS/sdks"
          cp -R iPhoneOS12.4.sdk "$THEOS/sdks/"
          ls "$THEOS/sdks"

      - name: Build the .deb
        run: |
          set -o pipefail
          make clean || true
          make package FINALPACKAGE=1 ARCHS=arm64 2>&1 | tee build.log

      - name: Show what was produced
        if: always()
        run: |
          ls -la packages/ 2>/dev/null || true
          find . -name '*.deb' -maxdepth 3 | head

      - name: Upload .deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: y2k-ios12-deb
          path: packages/*.deb
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
